# ─── Production-like local testing ────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d

version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: zyphorix-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://zyphorix:password@postgres:5432/zyphorix_guard
      DIRECT_URL: postgresql://zyphorix:password@postgres:5432/zyphorix_guard
      AUTH_SECRET: ${AUTH_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zyphorix
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zyphorix_guard
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zyphorix']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prod_postgres_data:
